<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ukas AI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    background: #fff;
    width: 100%;
    max-width: 720px;
    border-radius: 18px;
    box-shadow: 0 25px 70px rgba(0,0,0,0.45);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 88vh;
  }
  header {
    background: linear-gradient(135deg, #0f2027, #2c5364);
    color: white;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header .logo {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: linear-gradient(135deg, #00c6ff, #0072ff);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem; font-weight: 800;
  }
  header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.5px; }
  header small { display: block; font-size: 0.75rem; opacity: 0.75; font-weight: 400; }

  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: #f7f9fc;
  }
  .msg {
    max-width: 82%;
    padding: 12px 16px;
    border-radius: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 0.95rem;
    animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .user {
    align-self: flex-end;
    background: linear-gradient(135deg, #0072ff, #00c6ff);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .ai {
    align-self: flex-start;
    background: #fff;
    color: #222;
    border: 1px solid #e3e9f0;
    border-bottom-left-radius: 4px;
  }
  .typing { font-style: italic; color: #888; }

  .input-area {
    display: flex;
    padding: 14px 16px;
    background: #fff;
    border-top: 1px solid #e3e9f0;
    gap: 10px;
  }
  .input-area textarea {
    flex: 1;
    padding: 12px;
    border: 1px solid #c5cdd6;
    border-radius: 10px;
    resize: none;
    font-family: inherit;
    font-size: 0.95rem;
    outline: none;
    height: 48px;
  }
  .input-area textarea:focus { border-color: #0072ff; }
  .input-area button {
    padding: 0 26px;
    background: #0072ff;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 700;
    font-size: 1rem;
  }
  .input-area button:hover { background: #005bd1; }
  .input-area button:disabled { background: #a9b8c7; cursor: not-allowed; }

  .footer-note {
    text-align: center;
    font-size: 0.72rem;
    color: #8b98a7;
    padding: 6px 0 12px;
    background: #fff;
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">U</div>
      <div>
        <h1>Ukas AI</h1>
        <small>Asisten pintar Anda</small>
      </div>
    </header>

    <div class="chat" id="chat">
      <div class="msg ai">Halo! Saya Ukas AI 👋 Tanyakan apa saja kepada saya.</div>
    </div>

    <div class="input-area">
      <textarea id="input" placeholder="Ketik pesan untuk Ukas AI..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"></textarea>
      <button id="sendBtn" onclick="send()">Kirim</button>
    </div>
    <div class="footer-note">Ukas AI · Powered by OpenAI</div>
  </div>

<script>
/* ============================================================
   ⚠️  MASUKKAN API KEY OPENAI ANDA DI BAWAH INI
   Ganti tulisan "sk-ISI_API_KEY_KAMU_DISINI" dengan API key asli
   ============================================================ */
const API_KEY = "sk-AQ.Ab8RN6IlQD04TS4uCrPH93Mn_Pj06uXLr5CmEr8EHh-0irzH8A";

/* Model yang dipakai (bisa ganti: gpt-4o-mini, gpt-3.5-turbo, gpt-4o) */
const MODEL = "gpt-4o-mini";

/* Identitas Ukas AI */
const SYSTEM_PROMPT = "Anda adalah Ukas AI, asisten AI yang ramah, cerdas, dan membantu. Jawab dengan jelas dalam bahasa yang sama dengan pengguna.";

/* ============================================================
   Di bawah ini tidak perlu diubah
   ============================================================ */
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
let history = [];

function addMessage(text, sender) {
  const div = document.createElement('div');
  div.className = 'msg ' + sender;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;

  if (!API_KEY || API_KEY.includes("ISI_API_KEY")) {
    alert("API key belum diisi! Buka file index.html dan ganti API_KEY di bagian <script>.");
    return;
  }

  addMessage(text, 'user');
  inputEl.value = '';
  sendBtn.disabled = true;

  const loadingMsg = addMessage('Ukas AI sedang mengetik...', 'ai');
  loadingMsg.classList.add('typing');

  history.push({ role: 'user', content: text });

  try {
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + API_KEY
      },
      body: JSON.stringify({
        model: MODEL,
        messages: [
          { role: 'system', content: SYSTEM_PROMPT },
          ...history
        ]
      })
    });

    const data = await res.json();

    if (data.error) {
      loadingMsg.textContent = '❌ Error: ' + data.error.message;
      loadingMsg.classList.remove('typing');
    } else {
      const reply = data.choices[0].message.content;
      loadingMsg.textContent = reply;
      loadingMsg.classList.remove('typing');
      history.push({ role: 'assistant', content: reply });
    }
  } catch (err) {
    loadingMsg.textContent = '❌ Gagal terhubung: ' + err.message;
    loadingMsg.classList.remove('typing');
  }

  sendBtn.disabled = false;
  inputEl.focus();
}
</script>
</body>
</html>
